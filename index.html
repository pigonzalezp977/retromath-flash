<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroMath Flash Challenge</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Afacad+Flux:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #8a2be2;
            --secondary: #2e1a47;
            --accent: #d1ff4c;
            --orange: #ff8c00;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #334155;
            --border: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Afacad Flux', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(46, 26, 71, 0.1);
            padding: 30px;
            border: 2px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-family: 'Comfortaa', cursive;
            color: var(--secondary);
            font-size: 36px;
            margin-bottom: 5px;
        }

        h1 span {
            color: var(--primary);
        }

        .subtitle {
            font-size: 18px;
            color: #64748b;
            font-weight: 600;
        }

        /* HUD: Marcadores */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--secondary);
            color: white;
            padding: 15px 25px;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        .hud-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
        }

        .hud-item i {
            color: var(--accent);
        }

        .timer-highlight {
            color: var(--orange);
            font-family: 'Comfortaa', cursive;
            font-size: 24px;
        }

        /* Grilla del Juego */
        .matrix-wrapper {
            overflow-x: auto;
            margin-bottom: 25px;
            border-radius: 16px;
            border: 2px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            height: 65px;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            border: 1px solid var(--border);
        }

        th {
            background: #f1f5f9;
            color: var(--secondary);
            min-width: 60px;
        }

        th.corner {
            background: var(--secondary);
            color: var(--accent);
            font-family: 'Comfortaa', cursive;
            font-size: 26px;
        }

        th.row-header {
            background: #f1f5f9;
            color: var(--primary);
        }

        /* Inputs de las Celdas */
        .cell-input {
            width: 100%;
            height: 100%;
            border: none;
            text-align: center;
            font-size: 22px;
            font-weight: 700;
            font-family: 'Afacad Flux', sans-serif;
            color: var(--secondary);
            background: transparent;
            transition: all 0.2s;
        }

        .cell-input:focus {
            outline: 2px solid var(--primary);
            background: #f8fafc;
        }

        .cell-input.correct {
            background-color: #f0fdf4 !important;
            color: #16a34a;
        }

        .cell-input.incorrect {
            background-color: #fef2f2 !important;
            color: #dc2626;
        }

        /* Pantallas de Inicio, Niveles y Fin */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 40px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }

        .level-selector {
            display: flex;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 30px;
            font-size: 18px;
            font-weight: 700;
            font-family: 'Comfortaa', cursive;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(138, 43, 226, 0.2);
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            background: var(--secondary);
            transform: translateY(-2px);
        }

        .btn-l1 { background-color: #22c55e; box-shadow: 0 6px 15px rgba(34, 197, 94, 0.3); }
        .btn-l2 { background-color: #eab308; box-shadow: 0 6px 15px rgba(234, 179, 8, 0.3); }
        .btn-l3 { background-color: #ef4444; box-shadow: 0 6px 15px rgba(239, 68, 68, 0.3); }

        .icon-big {
            font-size: 70px;
            color: var(--primary);
            margin-bottom: 15px;
        }

        .score-summary {
            font-size: 26px;
            font-weight: 700;
            color: var(--secondary);
            margin: 10px 0;
        }

        .score-summary span {
            color: var(--orange);
            font-size: 34px;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #e2e8f0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, var(--primary), var(--orange));
            transition: width 1s linear;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="screen" id="start-screen">
            <div class="icon-big"><i class="fa-solid fa-shuffle"></i></div>
            <h1>RetroMath <span>Flash</span></h1>
            <p class="subtitle" style="margin-top: 10px; max-width: 550px;">
                ¡Las tablas cambian de posición en cada nivel! Elige tu desafío. Tienes 2 minutos (120s) para completarlo.
            </p>
            <div class="level-selector">
                <button class="btn btn-l1" onclick="startGame(1)"><i class="fa-solid fa-baby"></i> Nivel 1 (Tablas 1-5)</button>
                <button class="btn btn-l2" onclick="startGame(2)"><i class="fa-solid fa-graduation-cap"></i> Nivel 2 (Tablas 2-9)</button>
                <button class="btn btn-l3" onclick="startGame(3)"><i class="fa-solid fa-fire"></i> Nivel 3 (Tablas 1-12)</button>
            </div>
        </div>

        <div class="screen hidden" id="end-screen">
            <div id="end-icon" class="icon-big"><i class="fa-solid fa-trophy"></i></div>
            <h1 id="end-title">¡Tiempo Completado!</h1>
            <p class="score-summary">Puntaje Final: <span id="final-score">0</span> / <span id="total-score-target">0</span></p>
            <p id="end-message" class="subtitle" style="max-width: 500px; margin-bottom: 15px;"></p>
            <button class="btn" style="background: var(--secondary);" onclick="showMenu()">
                <i class="fa-solid fa-bars"></i> Volver al Menú
            </button>
        </div>

        <header>
            <h1>RetroMath <span>Flash</span></h1>
            <p class="subtitle" id="game-level-title">Nivel</p>
        </header>

        <div class="progress-bar-container">
            <div class="progress-bar" id="time-bar"></div>
        </div>

        <div class="hud">
            <div class="hud-item">
                <i class="fa-solid fa-clock"></i>
                <span id="timer" class="timer-highlight">02:00</span>
            </div>
            <div class="hud-item">
                <i class="fa-solid fa-star"></i>
                <span>Puntos: <span id="score">0</span>/<span id="hud-total">0</span></span>
            </div>
        </div>

        <div class="matrix-wrapper">
            <table>
                <thead id="matrix-head">
